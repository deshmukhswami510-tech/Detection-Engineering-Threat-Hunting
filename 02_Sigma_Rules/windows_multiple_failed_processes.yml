title: Suspicious Windows Process Execution
id: 8b7a2f31-0004-4c1a-9f10-000000000004
status: experimental
description: Detects suspicious process execution using command-line tools.
author: Swami Pravin Deshmukh
date: 2026-11-18
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\wscript.exe'
  condition: selection
falsepositives:
  - Legitimate administrative activity
level: low
