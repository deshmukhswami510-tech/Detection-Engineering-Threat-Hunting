title: Suspicious PowerShell Encoded Command
id: 8b7a2f31-0003-4c1a-9f10-000000000003
status: experimental
description: Detects PowerShell commands using encoded command arguments.
author: Swami Pravin Deshmukh
date: 2026-11-18
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\powershell.exe'
    CommandLine|contains:
      - '-enc'
      - '-encodedcommand'
  condition: selection
falsepositives:
  - Legitimate administrative scripts using encoded commands
level: medium