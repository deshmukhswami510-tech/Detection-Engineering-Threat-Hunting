
title: Windows Brute Force Correlation
id: 8b7a2f31-0002-4c1a-9f10-000000000002
status: experimental
description: Detects five or more failed login events from the same source IP within five minutes.
correlation:
  type: event_count
  rules:
    - windows_brute_force
  group-by:
    - SourceIP
  timespan: 5m
  condition:
    gte: 5
level: high
